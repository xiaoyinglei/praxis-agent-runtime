name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Prepare Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor libseccomp2 python3-venv python3-pip
          if ! /usr/bin/bwrap --unshare-user --unshare-pid --ro-bind / / /bin/true; then
            if sudo grep -R -q '/usr/bin/bwrap' /etc/apparmor.d; then
              echo 'Existing bwrap AppArmor policy blocks the namespace probe; refusing a second profile.' >&2
              exit 1
            fi
            sudo install -m 0644 scripts/ubuntu/praxis-bwrap.apparmor /etc/apparmor.d/praxis-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/praxis-bwrap
            /usr/bin/bwrap --unshare-user --unshare-pid --ro-bind / / /bin/true
          fi
      - name: Install pinned optional patch executor
        run: |
          python3 scripts/ubuntu/install-codex-patch.py --destination "$RUNNER_TEMP/codex-patch"
          echo "PRAXIS_TEST_CODEX_BINARY=$RUNNER_TEMP/codex-patch" >> "$GITHUB_ENV"
      - name: Sync locked environment
        run: uv sync --locked --all-extras
      - name: Ruff
        run: uv run --all-extras ruff check .
      - name: Mypy
        run: uv run --all-extras mypy
      - name: Pytest
        run: uv run --all-extras pytest -q
      - name: Web evidence quality acceptance
        run: uv run --all-extras python scripts/agent_web_quality.py
      - name: Chromium evidence and isolation acceptance
        run: |
          uv sync --locked --all-extras
          uv run --all-extras playwright install --with-deps --only-shell chromium
          PRAXIS_TEST_BROWSER=1 uv run --all-extras pytest -q tests/agent/test_web_browser.py tests/agent/test_connection_manager_browser.py
      - name: Model service isolation smoke
        run: |
          smoke_wheels="$RUNNER_TEMP/praxis-model-wheels"
          mkdir -p "$smoke_wheels"
          /usr/bin/python3 -m pip download --require-hashes --only-binary=:all: --no-deps \
            -r scripts/ubuntu/requirements-model-service.txt -d "$smoke_wheels"
          sudo /usr/bin/python3 -I scripts/ubuntu/smoke-model-service.py --wheel-dir "$smoke_wheels"
      - name: Import contracts
        run: uv run --all-extras lint-imports
      - name: Build distribution
        run: uv build
      - name: CLI projection smoke
        run: uv run --all-extras python scripts/agent_cli_smoke.py
      - name: Delivery smoke
        run: uv run --all-extras python scripts/agent_delivery_smoke.py --fake-model --verbose
      - name: Public path acceptance assets
        run: uv run --all-extras python scripts/agent_public_path_benchmark.py validate
      - name: Recorded model quality baseline
        run: uv run --all-extras python scripts/agent_model_quality_gate.py validate
      - name: Installed wheel smoke
        shell: bash
        run: |
          smoke_root="$(mktemp -d "$RUNNER_TEMP/praxis-wheel-smoke.XXXXXX")"
          smoke_venv="$smoke_root/venv"
          mapfile -d '' -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print0)
          if [ "${#wheels[@]}" -ne 1 ]; then
            printf 'Expected exactly one wheel in dist, found %s\n' "${#wheels[@]}" >&2
            exit 1
          fi
          wheel="$(realpath "${wheels[0]}")"

          uv export --locked --all-extras --no-dev --no-hashes --no-emit-project \
            --output-file "$smoke_root/constraints.txt"
          uv venv --no-project --python 3.12 "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" \
            --constraint "$smoke_root/constraints.txt" "$wheel"
          cd "$smoke_root"
          "$smoke_venv/bin/agent" --help
          "$smoke_venv/bin/agent" run --help
          "$smoke_venv/bin/agent" connections --help
          "$smoke_venv/bin/python" - <<'PY'
          from importlib.metadata import distributions
          from importlib.resources import files
          import pandas, openpyxl, fitz, scipy, matplotlib
          forbidden = {"docling", "flagembedding", "torch", "transformers", "mlx-lm", "pymilvus"}
          assert forbidden.isdisjoint({d.metadata["Name"].lower() for d in distributions()})
          assert "连接服务" in files("agent_runtime").joinpath("connection_assets/index.html").read_text()
          PY
          PRAXIS_MODEL_REGISTRY_PATH="$smoke_root/models.yaml" \
            "$smoke_venv/bin/python" "$GITHUB_WORKSPACE/scripts/agent_delivery_smoke.py" --fake-model
          uv pip install --python "$smoke_venv/bin/python" \
            --constraint "$smoke_root/constraints.txt" "${wheel}[rag]"
          "$smoke_venv/bin/rag" --help

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Require native Seatbelt
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true
      - name: Sync locked runtime and development environment
        run: uv sync --locked
      - name: Native command, file permission, and terminal regressions
        run: |
          uv run pytest -q \
            tests/agent/test_run_command_safety.py \
            tests/agent/test_command_sessions.py \
            tests/agent/test_command_recovery.py \
            tests/agent/harness/test_macos_command_sessions.py \
            tests/agent/harness/test_real_sandbox_path.py \
            tests/agent/test_permission_sandbox.py \
            tests/agent/test_permission_integration.py \
            tests/agent/test_file_manifest.py \
            tests/agent/test_local_files.py \
            tests/agent/test_cli_chat_commands.py \
            tests/agent/harness/test_public_agent_cutover.py \
            tests/agent/test_terminal_input.py \
            tests/agent/test_terminal_render.py \
            tests/agent/test_terminal_ui.py \
            tests/agent/test_terminal_ui_modes.py \
            tests/agent/test_terminal_approval.py \
            tests/agent/test_terminal_steering.py \
            tests/agent/test_terminal_connections.py
