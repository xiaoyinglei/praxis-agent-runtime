name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Prepare Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor python3-venv python3-pip
          if ! /usr/bin/bwrap --unshare-user --unshare-pid --ro-bind / / /bin/true; then
            if sudo grep -R -q '/usr/bin/bwrap' /etc/apparmor.d; then
              echo 'Existing bwrap AppArmor policy blocks the namespace probe; refusing a second profile.' >&2
              exit 1
            fi
            sudo install -m 0644 scripts/ubuntu/praxis-bwrap.apparmor /etc/apparmor.d/praxis-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/praxis-bwrap
            /usr/bin/bwrap --unshare-user --unshare-pid --ro-bind / / /bin/true
          fi
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
      - name: Web evidence quality acceptance
        run: uv run python scripts/agent_web_quality.py
      - name: Chromium evidence and isolation acceptance
        run: |
          uv sync --locked --extra browser
          uv run --extra browser playwright install --with-deps --only-shell chromium
          PRAXIS_TEST_BROWSER=1 uv run --extra browser pytest -q tests/agent/test_web_browser.py
      - name: Model service isolation smoke
        run: |
          smoke_wheels="$RUNNER_TEMP/praxis-model-wheels"
          mkdir -p "$smoke_wheels"
          /usr/bin/python3 -m pip download --require-hashes --only-binary=:all: --no-deps \
            -r scripts/ubuntu/requirements-model-service.txt -d "$smoke_wheels"
          sudo /usr/bin/python3 -I scripts/ubuntu/smoke-model-service.py --wheel-dir "$smoke_wheels"
      - name: Import contracts
        run: uv run lint-imports
      - name: Build distribution
        run: uv build
      - name: CLI projection smoke
        run: uv run python scripts/agent_cli_smoke.py
      - name: Delivery smoke
        run: uv run python scripts/agent_delivery_smoke.py --fake-model --verbose
      - name: Harness acceptance contract
        if: ${{ hashFiles('evals/harness/acceptance_v1.json') != '' && hashFiles('docs/design/praxis_harness_architecture.md') != '' }}
        run: uv run python scripts/agent_harness_acceptance.py validate --schema evals/harness/acceptance_v1.json --contract docs/design/praxis_harness_architecture.md
      - name: Benchmark manifest
        if: ${{ hashFiles('evals/code_agent/benchmark_v1.json') != '' }}
        run: uv run python scripts/agent_code_benchmark.py validate evals/code_agent/benchmark_v1.json --repository .
      - name: Installed wheel smoke
        shell: bash
        run: |
          smoke_root="$(mktemp -d "$RUNNER_TEMP/praxis-wheel-smoke.XXXXXX")"
          smoke_venv="$smoke_root/venv"
          mapfile -d '' -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print0)
          if [ "${#wheels[@]}" -ne 1 ]; then
            printf 'Expected exactly one wheel in dist, found %s\n' "${#wheels[@]}" >&2
            exit 1
          fi
          wheel="${wheels[0]}"

          uv venv --no-project --python 3.12 "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" "$wheel"
          cd "$smoke_root"
          "$smoke_venv/bin/agent" --help
          "$smoke_venv/bin/rag" --help
