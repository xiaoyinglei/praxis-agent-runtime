# MCP Server Configuration
# Each server must be explicitly enabled and have an explicit tools_allowlist.
# Default: all servers are disabled.

servers:
  # Preferred setup: agent mcp add github (personal connection + Keychain).
  # This disabled example shows the generic HTTP configuration with env auth.
  - name: github
    transport: http
    url: https://api.githubcopilot.com/mcp/readonly
    bearer_token_env_var: GITHUB_TOKEN
    headers:
      X-MCP-Readonly: "true"
    read_only: true
    tools_allowlist:
      - search_repositories
      - get_file_contents
      - issue_read
      - pull_request_read
    enabled: false

  - name: postgres
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-postgres"]
    env:
      DATABASE_URL: ${POSTGRES_URL}
    tools_allowlist:
      - query
      - list_tables
    enabled: false

  - name: filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem"]
    env:
      ALLOWED_DIRECTORIES: ${MCP_FS_ALLOWED_DIRS}
    tools_allowlist:
      - read_file
      - list_directory
      - search_files
    enabled: false
