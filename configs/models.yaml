# Cloud snapshot: 2026-10-22; maintained in configs/model-catalog.yaml.
# Regenerate with: uv run python scripts/sync_model_catalog.py
# Local and older research entries are preserved; they are outside this snapshot.
providers:
  mlx:
    location: local
  deepseek:
    protocol: openai_compatible
    location: cloud
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  groq:
    protocol: openai_compatible
    location: cloud
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  kimi:
    protocol: openai_compatible
    location: cloud
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
  mimo:
    protocol: openai_compatible
    location: cloud
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    api_key_env: MIMO_API_KEY
  sentence_transformers:
    protocol: sentence_transformers
    location: local
  minimax:
    protocol: openai_compatible
    location: cloud
    base_url: https://api.minimax.cn/v1
    api_key_env: MINIMAX_API_KEY
  qwen:
    protocol: openai_compatible
    location: cloud
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
models:
  mlx-community/Qwen3.5-9B-4bit:
    capability: chat
    provider: mlx
    protocol: openai_compatible
    base_url: http://127.0.0.1:8080/v1
    context_window_tokens: 262144
    reasoning:
      thinking_toggle: chat_template_kwargs
    timeout_seconds: 300
    defaults:
      provider_options:
        chat_template_kwargs:
          enable_thinking: true
  mlx-community/gemma-4-26b-a4b-it-4bit:
    capability: chat
    provider: mlx
    protocol: openai_compatible
    base_url: http://127.0.0.1:8080/v1
    context_window_tokens: 262144
  deepseek-chat:
    capability: chat
    provider: deepseek
    context_window_tokens: 128000
  deepseek-reasoner:
    capability: chat
    provider: deepseek
    context_window_tokens: 128000
  deepseek-v4-flash:
    capability: chat
    provider: deepseek
    context_window_tokens: 128000
    experimental: true
  mimo-v2.5-pro:
    capability: chat
    provider: mimo
    context_window_tokens: 256000
  kimi-k2.6:
    capability: chat
    provider: kimi
    context_window_tokens: 262144
    defaults:
      temperature: 1.0
      top_p: 0.95
      provider_options:
        thinking:
          type: enabled
  mlx-community/Qwen3-Embedding-8B-4bit-DWQ:
    capability: embedding
    provider: mlx
    protocol: mlx_embedding
    embedding_space: mlx/Qwen3-Embedding-8B-4bit-DWQ
  mlx-community/Qwen3-Embedding-4B-4bit-DWQ:
    capability: embedding
    provider: mlx
    protocol: mlx_embedding
    embedding_space: mlx/Qwen3-Embedding-4B-4bit-DWQ
  BAAI/bge-reranker-v2-m3:
    capability: reranker
    provider: sentence_transformers
  Qwen/Qwen3-Reranker-4B:
    capability: reranker
    provider: sentence_transformers
  deepseek-flash:
    capability: chat
    provider: deepseek
    continuation_summary_role: assistant
    tokenizer_model: deepseek-v4-official
    context_window_tokens: 1048576
    max_output_tokens: 393216
    reasoning:
      supported_efforts:
      - low
      - high
      - max
      default_effort: high
      thinking_toggle: thinking
    defaults:
      temperature: 1.0
      top_p: 0.95
      max_output_tokens: 65536
      provider_options:
        thinking:
          type: enabled
  deepseek-v4-pro:
    capability: chat
    provider: deepseek
    context_window_tokens: 1048576
    max_output_tokens: 393216
    reasoning:
      supported_efforts:
      - low
      - high
      - max
      default_effort: high
      thinking_toggle: thinking
    defaults:
      temperature: 1.0
      top_p: 0.95
      max_output_tokens: 65536
      provider_options:
        thinking:
          type: enabled
  kimi-k3:
    capability: chat
    provider: kimi
    context_window_tokens: 1048576
    max_output_tokens: 1048576
    reasoning:
      supported_efforts:
      - low
      - high
      - max
      default_effort: high
    defaults:
      temperature: 1.0
      top_p: 0.95
      max_output_tokens: 65536
  qwen3.8-max:
    capability: chat
    provider: qwen
    context_window_tokens: 983616
    max_output_tokens: 131072
    supports_structured_output: true
    reasoning:
      supported_efforts:
      - low
      - medium
      - xhigh
      default_effort: medium
    defaults:
      temperature: 1.0
      top_p: 0.95
      max_output_tokens: 65536
  qwen3.8-flash:
    capability: chat
    provider: qwen
    context_window_tokens: 983616
    max_output_tokens: 131072
    supports_structured_output: true
    reasoning:
      supported_efforts:
      - low
      - medium
      - xhigh
      default_effort: medium
    defaults:
      temperature: 1.0
      top_p: 0.95
      max_output_tokens: 65536
  MiniMax-M3.1-Flash:
    capability: chat
    provider: minimax
    context_window_tokens: 1000000
    max_output_tokens: 524288
    supports_structured_output: false
    reasoning:
      supported_efforts:
      - low
      - medium
      - high
      - xhigh
      - max
      default_effort: high
    defaults:
      temperature: 1.0
      top_p: 0.95
      max_output_tokens: 65536
  openai/gpt-oss-120b:
    capability: chat
    provider: groq
    tokenizer_model: gpt-oss-120b
    context_window_tokens: 131072
    max_output_tokens: 65536
    reasoning:
      supported_efforts:
      - low
      - medium
      - high
      default_effort: medium
    defaults:
      temperature: 1.0
      top_p: 0.95
      max_output_tokens: 8192
  llama-3.3-70b-versatile:
    capability: chat
    provider: groq
    context_window_tokens: 131072
    max_output_tokens: 32768
    supports_structured_output: false
    reasoning:
      supported_efforts: []
    defaults:
      temperature: 1.0
      top_p: 0.95
      max_output_tokens: 8192
defaults:
  primary_model: deepseek-flash
  embedding_model: mlx-community/Qwen3-Embedding-8B-4bit-DWQ
  reranker_model: Qwen/Qwen3-Reranker-4B
generation:
  summary:
    max_tokens: 1024
    temperature: 0.3
  answer:
    max_tokens: 4096
    temperature: 0.7
  planner:
    max_tokens: 2048
    temperature: 0.3
  synthesize:
    max_tokens: 4096
    temperature: 0.5
  factcheck:
    max_tokens: 2048
    temperature: 0.1
  tool_decision:
    max_tokens: 4096
    temperature: 0.2
  final_answer:
    max_tokens: 4096
    temperature: 0.5
auto_compact_token_limit: 65536
llm_budgets:
  context_compaction:
    max_input_tokens: null
    max_output_tokens: 8192
    safety_margin_tokens: 512
  agent_step:
    max_input_tokens: null
    max_output_tokens: 32768
    safety_margin_tokens: 512
  retrieval_summary:
    max_input_tokens: 6000
    max_output_tokens: 1024
    safety_margin_tokens: 512
  llm_summarize:
    max_input_tokens: 16000
    max_output_tokens: 2048
    safety_margin_tokens: 512
  llm_generate:
    max_input_tokens: 16000
    max_output_tokens: 3072
    safety_margin_tokens: 512
  rag_answer:
    max_input_tokens: 16000
    max_output_tokens: 4096
    safety_margin_tokens: 512
tokenizer:
  tokenizer_backend: auto
  chunk_token_size: 480
  chunk_overlap_tokens: 64
  prompt_reserved_tokens: 256
  local_files_only: true
