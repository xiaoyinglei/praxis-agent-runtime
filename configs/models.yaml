# Model catalog: single source of truth for model configuration.
#
# Design rules:
#   1. Business code MUST NOT reference provider names, base_url, api_key, or raw model names directly.
#   2. Resolve models only through rag.models.runtime.resolve_runtime_config().
#   3. Provider = how to connect.
#   4. Model = what model to use.
#   5. Generation = how to use the selected model for a task.
#   6. Budgets/tokenizer = runtime limits, not model identity.

# ---------------------------------------------------------------------------
# Providers: connection-level configuration.
# ---------------------------------------------------------------------------
providers:
  mlx:
    location: local

  deepseek:
    protocol: openai_compatible
    location: cloud
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY

  groq:
    protocol: openai_compatible
    location: cloud
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY

  kimi:
    protocol: openai_compatible
    location: cloud
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY

  mimo:
    protocol: openai_compatible
    location: cloud
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    api_key_env: MIMO_API_KEY

  sentence_transformers:
    protocol: sentence_transformers
    location: local


# ---------------------------------------------------------------------------
# Models: model identity only.
# ---------------------------------------------------------------------------
models:
  # -------------------------------------------------------------------------
  # Chat models: local MLX.
  # -------------------------------------------------------------------------
  mlx-community/Qwen3.5-9B-4bit:
    capability: chat
    provider: mlx
    protocol: openai_compatible
    base_url: http://127.0.0.1:8080/v1
    context_window_tokens: 262144
    # MLX buffers a complete tool call before sending its arguments.
    timeout_seconds: 300
    defaults:
      provider_options:
        chat_template_kwargs:
          enable_thinking: true

  mlx-community/gemma-4-26b-a4b-it-4bit:
    capability: chat
    provider: mlx
    protocol: openai_compatible
    base_url: http://127.0.0.1:8080/v1
    context_window_tokens: 262144

  # -------------------------------------------------------------------------
  # Chat models: DeepSeek.
  # -------------------------------------------------------------------------
  deepseek-chat:
    capability: chat
    provider: deepseek
    context_window_tokens: 128000

  deepseek-reasoner:
    capability: chat
    provider: deepseek
    context_window_tokens: 128000

  # Keep only if your DeepSeek account actually supports this model.
  deepseek-v4-flash:
    capability: chat
    provider: deepseek
    context_window_tokens: 128000
    experimental: true

  # -------------------------------------------------------------------------
  # Chat models: Groq.
  # -------------------------------------------------------------------------
  openai/gpt-oss-120b:
    capability: chat
    provider: groq
    tokenizer_model: gpt-oss-120b
    context_window_tokens: 131072

  llama-3.3-70b-versatile:
    capability: chat
    provider: groq
    context_window_tokens: 32768

  # -------------------------------------------------------------------------
  # Chat models: MiMo.
  # -------------------------------------------------------------------------
  mimo-v2.5-pro:
    capability: chat
    provider: mimo
    context_window_tokens: 256000

  kimi-k2.6:
    capability: chat
    provider: kimi
    context_window_tokens: 262144
    defaults:
      temperature: 1.0
      top_p: 0.95
      provider_options:
        thinking:
          type: enabled

  # -------------------------------------------------------------------------
  # Embedding models.
  # -------------------------------------------------------------------------
  mlx-community/Qwen3-Embedding-8B-4bit-DWQ:
    capability: embedding
    provider: mlx
    protocol: mlx_embedding
    embedding_space: mlx/Qwen3-Embedding-8B-4bit-DWQ

  mlx-community/Qwen3-Embedding-4B-4bit-DWQ:
    capability: embedding
    provider: mlx
    protocol: mlx_embedding
    embedding_space: mlx/Qwen3-Embedding-4B-4bit-DWQ

  # -------------------------------------------------------------------------
  # Reranker models.
  # -------------------------------------------------------------------------
  BAAI/bge-reranker-v2-m3:
    capability: reranker
    provider: sentence_transformers

  Qwen/Qwen3-Reranker-4B:
    capability: reranker
    provider: sentence_transformers


# ---------------------------------------------------------------------------
# Defaults: what to use when no explicit model is requested.
# ---------------------------------------------------------------------------
defaults:
  # Product runs default to Groq so an omitted --model never starts a local
  # MLX server. Benchmark release lanes remain explicit in their manifest.
  primary_model: openai/gpt-oss-120b

  embedding_model: mlx-community/Qwen3-Embedding-8B-4bit-DWQ
  reranker_model: Qwen/Qwen3-Reranker-4B


# ---------------------------------------------------------------------------
# Generation profiles: parameters for the one selected chat model.
# Model selection happens only through the top-level model ID.
# ---------------------------------------------------------------------------
generation:
  summary:
    max_tokens: 1024
    temperature: 0.3

  answer:
    max_tokens: 4096
    temperature: 0.7

  planner:
    max_tokens: 2048
    temperature: 0.3

  synthesize:
    max_tokens: 4096
    temperature: 0.5

  factcheck:
    max_tokens: 2048
    temperature: 0.1

  tool_decision:
    max_tokens: 4096
    temperature: 0.2

  final_answer:
    max_tokens: 4096
    temperature: 0.5


# ---------------------------------------------------------------------------
# LLM stage budgets: input/output budget by internal LLM stage.
# ---------------------------------------------------------------------------
llm_budgets:
  # One Harness sampling round may produce tool calls or a final answer.
  # The model declaration supplies the requested output limit; this policy is
  # only the model-independent ceiling for an agent step.
  agent_step:
    max_input_tokens: 64000
    max_output_tokens: 32768
    safety_margin_tokens: 512

  goal_contract:
    max_input_tokens: 3000
    max_output_tokens: 512
    safety_margin_tokens: 256

  retrieval_hint:
    max_input_tokens: 2000
    max_output_tokens: 256
    safety_margin_tokens: 512

  tool_decision:
    max_input_tokens: 32000
    max_output_tokens: 4096
    safety_margin_tokens: 512

  retrieval_summary:
    max_input_tokens: 6000
    max_output_tokens: 1024
    safety_margin_tokens: 512

  llm_summarize:
    max_input_tokens: 16000
    max_output_tokens: 2048
    safety_margin_tokens: 512

  llm_compare:
    max_input_tokens: 20000
    max_output_tokens: 3072
    safety_margin_tokens: 512

  llm_generate:
    max_input_tokens: 16000
    max_output_tokens: 3072
    safety_margin_tokens: 512

  rag_answer:
    max_input_tokens: 16000
    max_output_tokens: 4096
    safety_margin_tokens: 512

  final_synthesis:
    max_input_tokens: 24000
    max_output_tokens: 4096
    safety_margin_tokens: 512


# ---------------------------------------------------------------------------
# Tokenizer/chunking defaults.
# Model context window should come from models.<model_id>.context_window_tokens.
# ---------------------------------------------------------------------------
tokenizer:
  tokenizer_backend: auto
  chunk_token_size: 480
  chunk_overlap_tokens: 64
  prompt_reserved_tokens: 256
  local_files_only: true
